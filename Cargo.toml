[workspace]
members = ["crazy-chorus-dsp"]

[package]
name = "chorus-render"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "render"
path = "src/main.rs"

[dependencies]
crazy-chorus-dsp = { path = "crazy-chorus-dsp" }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
